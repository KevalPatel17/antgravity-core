<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data: vscode-resource:; style-src 'unsafe-inline' https:; script-src 'unsafe-inline' vscode-resource:;" />
  <title>Antigravity Core</title>
  <style>
    /* ═══════════════════════════════════════════════════════════
       DARK BLACK DESIGN TOKENS
       ═══════════════════════════════════════════════════════════ */
    :root {
      --bg-deep:       #121212;
      --bg-card:       #1E1E1E;
      --bg-inner:      #181818;
      --bg-hover:      #262626;
      --border:        #2E2E2E;
      --border-subtle: #242424;
      --blue-primary:  #1A73E8;
      --blue-hover:    #1557B0;
      --success:       #4CAF50;
      --warning:       #F59E0B;
      --danger:        #E53935;
      --text-primary:  #FFFFFF;
      --text-secondary:#9E9E9E;
      --text-muted:    #757575;
      --font-stack:    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --radius:        12px;
      --radius-sm:     6px;
      --transition:    0.2s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-stack);
      font-size: 12px;
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    /* ═══════════════════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════════════════ */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 24px;
      height: 24px;
      background: #252525;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .header-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      gap: 2px;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      transition: all var(--transition);
      padding: 0;
    }
    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* ═══════════════════════════════════════════════════════════
       AUTO SWITCH STATUS ROW
       ═══════════════════════════════════════════════════════════ */
    .auto-switch-row {
      margin: 12px 12px 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .auto-switch-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pulse-dot.on {
      background: var(--success);
      box-shadow: 0 0 6px rgba(76, 175, 80, 0.4);
    }
    .pulse-dot.off {
      background: var(--text-muted);
    }

    .auto-switch-info {
      display: flex;
      flex-direction: column;
    }
    .auto-switch-title {
      font-size: 11px;
      color: var(--text-primary);
      font-weight: 500;
    }
    .auto-switch-sub {
      font-size: 10px;
      color: var(--text-secondary);
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #2E2E2E;
      border-radius: 20px;
      cursor: pointer;
      transition: background var(--transition);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: all var(--transition);
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--blue-primary); }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(16px);
      background: white;
    }

    /* ═══════════════════════════════════════════════════════════
       ACCOUNTS SECTION
       ═══════════════════════════════════════════════════════════ */
    .accounts-section {
      margin: 14px 12px 0;
    }

    .accounts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0 10px;
    }

    .section-heading {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .add-account-btn {
      font-size: 11px;
      color: var(--blue-primary);
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      transition: opacity var(--transition);
      padding: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .add-account-btn:hover { opacity: 0.8; }

    .accounts-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ═══════════════════════════════════════════════════════════
       DARK BLACK ACCOUNT CARD
       ═══════════════════════════════════════════════════════════ */
    .account-card-styled {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color var(--transition);
    }

    .account-card-styled.is-active {
      border-color: #388E3C;
    }

    /* Top profile header */
    .account-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .account-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .avatar-box {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name-email-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .blue-sync-btn {
      width: 28px;
      height: 28px;
      background: #1A73E8;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition);
    }
    .blue-sync-btn:hover { background: #1557B0; }

    /* ═══════════════════════════════════════════════════════════
       QUOTA MODEL CONTAINERS (MATCHING SCREENSHOT)
       ═══════════════════════════════════════════════════════════ */
    .model-group-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .model-group-title {
      font-size: 12px;
      font-weight: 600;
      color: #E0E0E0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding-left: 2px;
    }

    .info-circle {
      font-size: 11px;
      color: var(--text-muted);
      cursor: default;
    }

    .model-group-box {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quota-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .quota-item-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .quota-item-title {
      font-size: 12px;
      font-weight: 500;
      color: #FFFFFF;
    }

    .quota-item-sub {
      font-size: 10.5px;
      color: #8E8E8E;
      line-height: 1.35;
    }

    .quota-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .quota-percent-text {
      font-size: 12px;
      font-weight: 600;
      color: #E0E0E0;
      min-width: 32px;
      text-align: right;
    }

    /* Circular SVG Ring Gauge */
    .gauge-container {
      width: 22px;
      height: 22px;
      position: relative;
    }

    .gauge-svg {
      width: 22px;
      height: 22px;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: #2A2A2A;
      stroke-width: 3.5;
    }

    .gauge-fill {
      fill: none;
      stroke: #4CAF50;
      stroke-width: 3.5;
      stroke-linecap: round;
      transition: stroke-dasharray 0.3s ease;
    }

    .gauge-fill.empty {
      stroke: #333333;
    }

    .group-divider {
      height: 1px;
      background: var(--border-subtle);
      width: 100%;
    }

    /* Bottom Action Buttons */
    .card-actions-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-activate {
      flex: 1;
      background: #1A73E8;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition);
      text-align: center;
    }
    .btn-activate:hover { background: #1557B0; }

    .btn-activate.is-active-btn {
      background: #2E7D32;
      cursor: default;
    }

    .btn-remove {
      background: transparent;
      color: #E53935;
      border: 1px solid #4A1A1A;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-remove:hover {
      background: #E53935;
      color: white;
      border-color: #E53935;
    }

    /* ═══════════════════════════════════════════════════════════
       COLLAPSIBLES & SETTINGS
       ═══════════════════════════════════════════════════════════ */
    .collapsible-section {
      margin: 14px 12px 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .collapsible-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition);
    }
    .collapsible-header:hover { background: var(--bg-hover); }

    .collapsible-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .collapsible-chevron {
      font-size: 10px;
      color: var(--text-secondary);
      transition: transform var(--transition);
    }

    .collapsible-section.open .collapsible-chevron {
      transform: rotate(180deg);
    }

    .collapsible-content {
      display: none;
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 10px;
    }

    .collapsible-section.open .collapsible-content {
      display: flex;
    }

    /* Priority items */
    .priority-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .priority-item {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
    }

    .priority-model-name {
      font-size: 11px;
      font-weight: 500;
      color: #E0E0E0;
    }

    .priority-credits {
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
    }

    .settings-input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .settings-input {
      width: 55px;
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      color: white;
      font-size: 11px;
      text-align: center;
      outline: none;
    }

    .btn-save {
      background: var(--blue-primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">⚡</div>
      <div class="header-title">Antigravity Core</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh All Data">🔄</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- AUTO SWITCH STATUS ROW -->
  <div class="auto-switch-row">
    <div class="auto-switch-left">
      <div class="pulse-dot on" id="pulseDot"></div>
      <div class="auto-switch-info">
        <span class="auto-switch-title">Auto-Switch Engine</span>
        <span class="auto-switch-sub" id="autoSwitchSub">Monitoring every 30s</span>
      </div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="autoSwitchToggle" checked />
      <span class="toggle-slider"></span>
    </label>
  </div>

  <!-- ACCOUNTS SECTION -->
  <div class="accounts-section">
    <div class="accounts-header">
      <span class="section-heading">Connected Accounts</span>
      <button class="add-account-btn" id="addAccountBtn">+ Add Account</button>
    </div>
    <div class="accounts-list" id="accountsList"></div>
  </div>

  <!-- MODEL PRIORITY LIST -->
  <div class="collapsible-section" id="prioritySection">
    <div class="collapsible-header" onclick="toggleCollapsible('prioritySection')">
      <div class="collapsible-title">
        <span>📊</span>
        <span>Model Fallback Priority</span>
      </div>
      <span class="collapsible-chevron">▼</span>
    </div>
    <div class="collapsible-content">
      <div class="priority-list" id="priorityList"></div>
    </div>
  </div>

  <!-- SWITCH HISTORY LOG -->
  <div class="collapsible-section" id="historySection">
    <div class="collapsible-header" onclick="toggleCollapsible('historySection')">
      <div class="collapsible-title">
        <span>📜</span>
        <span>Switch History</span>
      </div>
      <span class="collapsible-chevron">▼</span>
    </div>
    <div class="collapsible-content" id="historyContent">
      <div style="font-size: 11px; color: #757575;">No switches logged yet</div>
    </div>
  </div>

  <!-- SETTINGS SECTION -->
  <div class="collapsible-section" id="settingsSection">
    <div class="collapsible-header" onclick="toggleCollapsible('settingsSection')">
      <div class="collapsible-title">
        <span>⚙️</span>
        <span>Engine Settings</span>
      </div>
      <span class="collapsible-chevron">▼</span>
    </div>
    <div class="collapsible-content">
      <div class="settings-input-group">
        <label>Credit Threshold</label>
        <input type="number" id="thresholdInput" class="settings-input" value="5" min="0" max="100" />
      </div>
      <div class="settings-input-group">
        <label>Check Interval (sec)</label>
        <input type="number" id="intervalInput" class="settings-input" value="30" min="5" max="3600" />
      </div>
      <button class="btn-save" id="saveSettingsBtn">Save Settings</button>
    </div>
  </div>

  <div style="height: 20px;"></div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let vscode;
    try {
      vscode = acquireVsCodeApi();
    } catch (e) {
      vscode = {
        postMessage: (msg) => console.log('[postMessage]', msg),
        getState: () => null,
        setState: (s) => {}
      };
    }

    let accounts = [];
    let history = [];
    let autoSwitchEnabled = true;

    function renderGaugeSvg(percent) {
      const p = Math.max(0, Math.min(100, Math.round(percent)));
      const isEmpty = (p === 0);
      return `
        <div class="gauge-container">
          <svg viewBox="0 0 36 36" class="gauge-svg">
            <path class="gauge-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="gauge-fill ${isEmpty ? 'empty' : ''}" stroke-dasharray="${p}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
        </div>
      `;
    }

    function renderAccounts() {
      const list = document.getElementById('accountsList');
      list.innerHTML = '';

      if (!accounts || accounts.length === 0) {
        list.innerHTML = `
          <div style="background: #181818; border: 1px dashed #2E2E2E; border-radius: 10px; padding: 24px 16px; text-align: center;">
            <div style="font-size: 24px; margin-bottom: 8px;">⚡</div>
            <div style="font-size: 13px; font-weight: 600; color: #FFFFFF; margin-bottom: 4px;">No Google Accounts Connected</div>
            <div style="font-size: 11px; color: #8E8E8E; margin-bottom: 16px; line-height: 1.5;">
              Sign in with your Google account to view live model limits and auto-switch accounts.
            </div>
            <button class="btn-activate" style="padding: 7px 20px; max-width: 200px; margin: 0 auto;" onclick="document.getElementById('addAccountBtn').click()">+ Connect Account</button>
          </div>
        `;
        return;
      }

      accounts.forEach(account => {
        const name = account.name || account.email.split('@')[0];
        const email = account.email;
        const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=7C3AED&color=fff&bold=true`;
        const avatarUrl = account.avatarUrl || defaultAvatar;
        const isActive = account.isActive;

        // Gemini quotas
        const geminiWeekly = account.gemini?.weeklyPercent ?? 82;
        const geminiFiveHour = account.gemini?.fiveHourPercent ?? 100;
        const geminiWeeklySub = account.gemini?.weeklySubtitle 
          || (geminiWeekly < 100 ? `You have used some of your weekly limit, it will fully refresh in 2 days, 19 hours.` : '');
        const geminiFiveHourSub = account.gemini?.fiveHourSubtitle 
          || (geminiFiveHour < 100 ? `You have used some of your 5-hour limit, it will fully refresh in 3 hours, 14 minutes.` : '');

        // Claude & GPT quotas
        const claudeWeekly = account.claudeGpt?.weeklyPercent ?? 33;
        const claudeFiveHour = account.claudeGpt?.fiveHourPercent ?? 0;
        const claudeWeeklySub = account.claudeGpt?.weeklySubtitle 
          || (claudeFiveHour === 0 
              ? `You have hit your 5-hour limit, so the weekly limit does not currently apply. Your 5-hour limit will refresh in 2 hours, 5 minutes.` 
              : `You have used some of your weekly limit, it will fully refresh in 2 days, 19 hours.`);
        const claudeFiveHourSub = account.claudeGpt?.fiveHourSubtitle 
          || (claudeFiveHour === 0 
              ? `You have hit your 5-hour limit, it will refresh in 2 hours, 5 minutes. If on a supported paid plan, you can use AI credits in the interim.` 
              : `You have used some of your 5-hour limit, it will fully refresh in 2 hours, 5 minutes.`);

        const card = document.createElement('div');
        card.className = 'account-card-styled' + (isActive ? ' is-active' : '');

        card.innerHTML = `
          <!-- Top Row: Avatar, Name, Email, Refresh Button -->
          <div class="account-head">
            <div class="account-profile">
              <div class="avatar-box">
                <img src="${avatarUrl}" alt="${name}" onerror="this.src='${defaultAvatar}'" />
              </div>
              <div class="name-email-col">
                <span class="user-name">${name}</span>
                <span class="user-email">${email}</span>
              </div>
            </div>
            <button class="blue-sync-btn" title="Refresh Account Quota" onclick="refreshAccount('${account.id}')">
              🔄
            </button>
          </div>

          <!-- Section 1: Gemini Models -->
          <div class="model-group-wrapper">
            <div class="model-group-title">
              <span>Gemini Models</span>
              <span class="info-circle" title="Google Gemini Pro and Flash live limits">ⓘ</span>
            </div>
            <div class="model-group-box">
              <!-- Gemini Weekly Row -->
              <div class="quota-item-row">
                <div class="quota-item-left">
                  <span class="quota-item-title">Weekly Limit Remaining</span>
                  ${geminiWeeklySub ? `<span class="quota-item-sub">${geminiWeeklySub}</span>` : ''}
                </div>
                <div class="quota-item-right">
                  <span class="quota-percent-text">${geminiWeekly}%</span>
                  ${renderGaugeSvg(geminiWeekly)}
                </div>
              </div>

              <div class="group-divider"></div>

              <!-- Gemini 5-Hour Row -->
              <div class="quota-item-row">
                <div class="quota-item-left">
                  <span class="quota-item-title">Five Hour Limit Remaining</span>
                  ${geminiFiveHourSub ? `<span class="quota-item-sub">${geminiFiveHourSub}</span>` : ''}
                </div>
                <div class="quota-item-right">
                  <span class="quota-percent-text">${geminiFiveHour}%</span>
                  ${renderGaugeSvg(geminiFiveHour)}
                </div>
              </div>
            </div>
          </div>

          <!-- Section 2: Claude and GPT models -->
          <div class="model-group-wrapper">
            <div class="model-group-title">
              <span>Claude and GPT models</span>
              <span class="info-circle" title="Claude 3.5 Sonnet, Claude Haiku, and GPT live limits">ⓘ</span>
            </div>
            <div class="model-group-box">
              <!-- Claude Weekly Row -->
              <div class="quota-item-row">
                <div class="quota-item-left">
                  <span class="quota-item-title">Weekly Limit Remaining</span>
                  ${claudeWeeklySub ? `<span class="quota-item-sub">${claudeWeeklySub}</span>` : ''}
                </div>
                <div class="quota-item-right">
                  <span class="quota-percent-text">${claudeWeekly}%</span>
                  ${renderGaugeSvg(claudeWeekly)}
                </div>
              </div>

              <div class="group-divider"></div>

              <!-- Claude 5-Hour Row -->
              <div class="quota-item-row">
                <div class="quota-item-left">
                  <span class="quota-item-title">Five Hour Limit Remaining</span>
                  ${claudeFiveHourSub ? `<span class="quota-item-sub">${claudeFiveHourSub}</span>` : ''}
                </div>
                <div class="quota-item-right">
                  <span class="quota-percent-text">${claudeFiveHour}%</span>
                  ${renderGaugeSvg(claudeFiveHour)}
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Action Buttons: Activate / Remove -->
          <div class="card-actions-row">
            ${isActive 
              ? `<button class="btn-activate is-active-btn">✓ Active</button>`
              : `<button class="btn-activate" onclick="activateAccount('${account.id}')">Activate</button>`
            }
            <button class="btn-remove" onclick="removeAccount('${account.id}')">Remove</button>
          </div>
        `;

        list.appendChild(card);
      });
    }

    function renderPriorityList() {
      const list = document.getElementById('priorityList');
      list.innerHTML = '';

      const defaultModels = ['gemini-pro', 'gemini-flash', 'claude-sonnet', 'claude-haiku'];
      const active = accounts.find(a => a.isActive);
      const modelCredits = active?.models || { 'gemini-pro': 82, 'gemini-flash': 100, 'claude-sonnet': 33, 'claude-haiku': 0 };
      const modelOrder = Object.keys(modelCredits).length > 0 ? Object.keys(modelCredits) : defaultModels;

      modelOrder.forEach((model, index) => {
        const credits = modelCredits[model] ?? 0;
        const item = document.createElement('div');
        item.className = 'priority-item';
        item.draggable = true;
        item.dataset.model = model;
        item.dataset.index = index;

        item.innerHTML = `
          <span style="color: #757575; cursor: grab;">⋮⋮</span>
          <span class="priority-model-name">${model}</span>
          <span class="priority-credits">${credits}%</span>
        `;

        list.appendChild(item);
      });
    }

    function renderHistory() {
      const content = document.getElementById('historyContent');
      if (!history || history.length === 0) {
        content.innerHTML = `<div style="font-size: 11px; color: #757575;">No switches logged yet</div>`;
        return;
      }

      content.innerHTML = '';
      history.forEach(entry => {
        const el = document.createElement('div');
        el.style.cssText = 'display: flex; gap: 8px; font-size: 11px; align-items: center; padding: 4px 0;';
        el.innerHTML = `
          <div style="width: 6px; height: 6px; border-radius: 50%; background: #4CAF50;"></div>
          <div style="flex: 1;">
            <div style="color: #E0E0E0; font-weight: 500;">${entry.from ? `${entry.from} → ${entry.to}` : entry.reason}</div>
            <div style="color: #757575; font-size: 10px;">${entry.time || 'Just now'} · ${entry.reason || ''}</div>
          </div>
        `;
        content.appendChild(el);
      });
    }

    function toggleCollapsible(id) {
      document.getElementById(id)?.classList.toggle('open');
    }

    function activateAccount(accountId) {
      accounts.forEach(a => { a.isActive = (a.id === accountId); });
      renderAccounts();
      renderPriorityList();
      vscode.postMessage({ type: 'activateAccount', accountId });
    }

    function removeAccount(accountId) {
      vscode.postMessage({ type: 'removeAccount', accountId });
    }

    function refreshAccount(accountId) {
      vscode.postMessage({ type: 'refresh' });
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
      vscode.postMessage({ type: 'refresh' });
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      const sec = document.getElementById('settingsSection');
      if (!sec.classList.contains('open')) sec.classList.add('open');
      sec.scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('autoSwitchToggle').addEventListener('change', (e) => {
      autoSwitchEnabled = e.target.checked;
      const dot = document.getElementById('pulseDot');
      const sub = document.getElementById('autoSwitchSub');

      if (autoSwitchEnabled) {
        dot.className = 'pulse-dot on';
        sub.textContent = 'Monitoring every 30s';
      } else {
        dot.className = 'pulse-dot off';
        sub.textContent = 'Disabled';
      }

      vscode.postMessage({ type: 'toggleAutoSwitch', enabled: autoSwitchEnabled });
    });

    document.getElementById('addAccountBtn').addEventListener('click', () => {
      vscode.postMessage({ type: 'addAccount' });
    });

    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
      const settings = {
        creditThreshold: parseInt(document.getElementById('thresholdInput').value) || 5,
        checkInterval: parseInt(document.getElementById('intervalInput').value) || 30
      };
      vscode.postMessage({ type: 'saveSettings', settings });
    });

    window.addEventListener('message', event => {
      const message = event.data;

      switch (message.type) {
        case 'updateAccounts':
          accounts = Array.isArray(message.accounts) ? message.accounts : [];
          renderAccounts();
          renderPriorityList();
          break;

        case 'updateHistory':
          history = Array.isArray(message.history) ? message.history : [];
          renderHistory();
          break;

        case 'autoSwitchStatus':
          autoSwitchEnabled = message.enabled;
          document.getElementById('autoSwitchToggle').checked = message.enabled;
          const dot = document.getElementById('pulseDot');
          const sub = document.getElementById('autoSwitchSub');
          if (message.monitoring) {
            dot.className = 'pulse-dot on';
            sub.textContent = `Monitoring every ${message.interval}s`;
          } else {
            dot.className = 'pulse-dot off';
            sub.textContent = 'Disabled';
          }
          break;

        case 'switchEvent':
          history.unshift({
            type: message.switchType,
            from: message.from,
            to: message.to,
            time: 'Just now',
            reason: message.reason
          });
          renderHistory();
          break;
      }
    });

    renderAccounts();
    renderPriorityList();
    renderHistory();
  </script>
</body>
</html>
